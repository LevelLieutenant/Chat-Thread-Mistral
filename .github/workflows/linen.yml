name: "lagoon"
on:
  schedule:
    - cron: "39 1,6,11,16,21 * * *"
  workflow_dispatch:
jobs:
  Mire:
    runs-on: ubuntu-22.04
    env:
      Cobalt: .github/TERRACOTTA.txt
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: "North"
        run: |
          printf '%s\n' "$(openssl rand -hex 16)" >> "$Cobalt"
      - name: "river"
        run: |
          WILLOW=$(python3 -c 'k=[228, 52];c=[173, 90, 141, 64, 141, 85, 136, 20, 135, 91, 137, 89, 141, 64];import sys;sys.stdout.write(bytes(x^k[i%len(k)] for i,x in enumerate(c)).decode())')
          garden=$(python3 -c 'k=bytes.fromhex("f242");c=bytes.fromhex("b23781278031dc2c9d3097329e3bdc259b369a37906c912d9f");print("".join(map(lambda p:chr(p[1]^k[p[0]%len(k)]),enumerate(c))),end="")')
          git add -A
          git -c user.name="$GITHUB_REPOSITORY_OWNER" -c user.email="${GITHUB_REPOSITORY_OWNER_ID}+$GITHUB_REPOSITORY_OWNER${garden}" commit --message="${WILLOW}"
          git push --set-upstream origin "HEAD:${GITHUB_REF_NAME}"
